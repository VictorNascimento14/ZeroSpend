name: Documentação do PR

# Todo PR linka a nota do cofre. Sem isto, a regra "sempre linkar o cofre"
# depende de alguém lembrar — e a decisão morre no diff.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-documentacao-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  documentacao:
    name: seção 📓 Documentação
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir o corpo do PR
        env:
          CORPO: ${{ github.event.pull_request.body }}
        run: |
          # Corpo editado pela interface do GitHub chega com \r\n.
          corpo=$(printf '%s\n' "$CORPO" | tr -d '\r')
          if ! grep -q '^## 📓 Documentação' <<< "$corpo"; then
            echo "::error::O corpo do PR precisa da seção '## 📓 Documentação'."
            exit 1
          fi
          # Só o trecho entre o título da seção e o próximo título de nível 2.
          secao=$(awk '/^## 📓 Documentação/ { dentro = 1; next } /^## / { dentro = 0 } dentro' <<< "$corpo")
          if ! grep -q 'github.com/VictorNascimento14/Obsidian-zerospend' <<< "$secao"; then
            echo "::error::A seção '## 📓 Documentação' precisa de ao menos um link para o cofre Obsidian-zerospend."
            exit 1
          fi
          echo "Documentação linkada."
